policies:
    #Mulesoft groupId where the policies are available
    groupId: "68ef9520-24e9-4cf2-b2f5-620025690913"

    #policies to be created/updated
    add-update:
        client-id-enforcement:
            version: "1.3.2"
            policyConfig: >
                "{
                    "credentialsOriginHasHttpBasicAuthenticationHeader": "customExpression",
                    "clientIdExpression": "#[attributes.headers['clientId']]",
                    "clientSecretExpression": "#[attributes.headers['clientSecret']]"
                }"
        ip-allowlist:
            version: "1.1.1"
            policyConfig: >
                "{
                    "ipExpression": "#[attributes.headers['x-forwarded-for']]",
                    "ips":["0.0.0.0/0"]
                }"
    
    #policies to be removed
    remove:
        - ip-allowlist